  <main>
    <section id="contact">
      <h2>Contact</h2>
      <form id="contactForm" novalidate style="max-width:400px;margin:0 auto;">
        <label for="contactName">Your Name</label>
        <input type="text" id="contactName" name="name" required style="width:100%;padding:8px;margin-top:4px;border-radius:5px;border:1px solid #ccc;">
        <label for="contactEmail">Your Email</label>
        <input type="email" id="contactEmail" name="email" required style="width:100%;padding:8px;margin-top:4px;border-radius:5px;border:1px solid #ccc;">
        <label for="contactPhone">Your Phone</label>
        <input type="text" id="contactPhone" name="phone" maxlength="14" inputmode="numeric" placeholder="(123) 456-7890" style="width:100%;padding:8px;margin-top:4px;border-radius:5px;border:1px solid #ccc;">
        <label for="contactMessage">Message</label>
        <textarea id="contactMessage" name="message" rows="4" required style="width:100%;padding:8px;margin-top:4px;border-radius:5px;border:1px solid #ccc;"></textarea>
        <button type="submit" style="margin-top:15px;background:#007BFF;color:white;border:none;padding:12px 20px;border-radius:5px;cursor:pointer;width:100%;">Send</button>
      </form><br />
      <div id="contactResult" style="margin-top:10px;text-align:center;font-weight:bold;"></div>
      <p>
        &#128231; <a href="mailto:k.m.fryson112115@gmail.com">k.m.fryson112115@gmail.com</a><br>

      </p>
    </section>
