<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Contact - Keon Fryson</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="../style.css" rel="stylesheet" type="text/css" />
    <link rel="icon" type="image/png" href="../logo.png">
    <script src="https://code.jquery.com/jquery-3.4.1.min.js" crossorigin="anonymous"></script>
    <script src="../script.js"></script>

<body>
    <header>
        <img src="../Profile.jpg" alt="Profile Photo" class="profile-photo">
        <h1>Keon Fryson</h1>
        <h3>Game Developer & Programmer</h3>
        <nav>
            <a href="../index.html">Home</a>
            <a href="../profile.html">Profile</a>
            <a href="../projects.html">Projects</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main>
        <section id="contact">
            <h2>Contact</h2>
            <form id="contactForm" novalidate>
                <label for="contactName">Your Name</label>
                <input type="text" id="contactName" name="name" required>

                <label for="contactEmail">Your Email</label>
                <input type="email" id="contactEmail" name="email" required>

                <label for="contactPhone">Your Phone</label>
                <input type="text" id="contactPhone" name="phone" maxlength="14" placeholder="(123) 456-7890">

                <label for="contactMessage">Message</label>
                <textarea id="contactMessage" name="message" rows="4" required></textarea>

                <button type="submit">Send</button>
            </form>

            <div id="contactResult" class="contact-result"></div>

            <p class="contact-info">
                📧 <a href="mailto:k.m.fryson112115@gmail.com">k.m.fryson112115@gmail.com</a><br>
                🔗 <a href="https://www.linkedin.com/in/keon-fryson-937447300/" target="_blank">LinkedIn</a>
            </p>
        </section>
    </main>

    <footer>© 2025 Keon Fryson. All rights reserved.</footer>
</body>
