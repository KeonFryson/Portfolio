<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Shadow-Sentinel — Play in Browser</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="../style.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            margin: 0;
            font-family: Roboto, Arial, sans-serif;
            background: #0f1115;
            color: #e6eef3;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

            header a.back {
                color: #00bcd4;
                text-decoration: none;
                padding: 8px 12px;
                border-radius: 6px;
                border: 1px solid rgba(0,188,212,.15);
            }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .player-wrap {
            width: 100%;
            max-width: 1200px;
            height: 700px;
            background: #050608;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        .player-iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .fallback {
            padding: 20px;
            text-align: center;
            color: #c0dbe6;
        }

        @media (max-width:900px) {
            .player-wrap {
                height: 62vh;
            }
        }
    </style>
</head>
<body>
    <header>
        <a class="back" href="../index.html">&larr; Back to Portfolio</a>
        <h1 style="margin:0;font-size:1.2rem;">Shadow-Sentinel — Play in Browser</h1>
    </header>

    <main>
        <div class="player-wrap" id="playerWrap">
            <!-- Replace build/index.html with the actual path to your WebGL build entry -->
            <iframe id="gameFrame" class="player-iframe" src="build/index.html" allow="autoplay; fullscreen"></iframe>
        </div>
    </main>

    <div class="fallback" id="fallback" style="display:none;">
        The in-browser build couldn't load. You can:
        <ul style="list-style: none; padding-left: 0;">
            <li><a href="build/index.html" style="color:#00bcd4;" target="_blank">Open the Web build directly</a></li>
            <li><a href="https://github.com/Devonflynn96/Shadow-Sentinel" style="color:#00bcd4;" target="_blank">Open project on GitHub</a></li>
        </ul>
    </div>

    <script>
    // If the iframe fails to load (e.g. missing build), show fallback after timeout
        (function () {
            var iframe = document.getElementById('gameFrame');
            var fallback = document.getElementById('fallback');
            var timeout = setTimeout(function () {
                // check if iframe loaded by probing contentWindow (may be cross-origin; rely on timeout)
                // If the iframe hasn't visually loaded within 6s assume missing build and show fallback link
                fallback.style.display = 'block';
                document.getElementById('playerWrap').style.display = 'none';
            }, 6000);

            iframe.addEventListener('load', function () {
                clearTimeout(timeout);
                // hide fallback if it appeared
                fallback.style.display = 'none';
                document.getElementById('playerWrap').style.display = 'block';
            });
        })();</script>
</body>
</html>
